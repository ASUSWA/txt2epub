[project]
name = "txt2epub"
version = "0.1.0"
description = "Convert plain TXT files to EPUB with regex-based chapter splitting"
readme = "README.md"
authors = [
    { name = "ASUSWA", email = "39334034+ASUSWA@users.noreply.github.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ebooklib>=0.20",
]
keywords = ["epub", "ebook", "txt", "converter", "chapter-splitting"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]

[project.scripts]
txt2epub = "txt2epub:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
